name: Perf

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base URL
        default: https://www.iksi.app
      slug:
        description: Existing short link to HEAD (no click is recorded)
        default: QdM2whH
      duration:
        description: Test duration
        default: 2m

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest # GitHub-hosted runners are in the US
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Redirect latency from a US runner
        run: |
          k6 run perf/k6/redirect.js \
            -e BASE="${{ inputs.base }}" -e SLUG="${{ inputs.slug }}" -e DURATION="${{ inputs.duration }}" \
            --summary-export summary-us.json
      - uses: actions/upload-artifact@v4
        with:
          name: k6-summary-us
          path: summary-us.json
