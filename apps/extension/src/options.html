<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iksi options</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
      .spec { margin-top: 16px; border-top: 1px solid var(--border); }
      .row { display: grid; grid-template-columns: 136px minmax(0, 1fr); column-gap: 24px;
             padding: 20px 0; border-bottom: 1px solid var(--border); }
      .label { padding-top: calc((var(--ctl) - 18px) / 2); font-size: 13px; line-height: 18px; color: var(--text-muted); }
      .inline { display: flex; align-items: center; gap: 8px; min-height: var(--ctl); }
      .inline .field { flex: 1 1 auto; min-width: 0; }
      .hint { margin-top: 8px; }
      .saved { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: var(--ctl); }
      .status { margin-top: 8px; }
      @media (max-width: 639px) {
        :root { --ctl: 44px; }
        .row { grid-template-columns: minmax(0, 1fr); row-gap: 8px; padding: 16px 0; }
        .label { padding-top: 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="brand"><img src="../icons/icon-32.png" alt="" />iksi</span>
      <h1 class="title" style="margin-top: 32px">Extension options</h1>
      <p class="muted" style="margin-top: 4px">
        The extension shortens links as you, using an API key from your
        <a href="https://www.iksi.app/dashboard" target="_blank" rel="noopener">iksi dashboard</a>.
      </p>

      <p class="status error" id="reason" role="alert"></p>

      <div class="spec">
        <div class="row" id="saved-row" hidden>
          <span class="label">Saved key</span>
          <div class="saved">
            <span class="mono" id="saved-prefix"></span>
            <button type="button" class="btn btn-text btn-danger" id="remove">Remove key</button>
          </div>
        </div>
        <div class="row">
          <label class="label" for="key" id="key-label">API key</label>
          <div>
            <form class="inline" id="form">
              <input class="field mono" id="key" type="password" autocomplete="off" spellcheck="false"
                     placeholder="iksi_…" aria-describedby="key-hint" />
              <button type="submit" class="btn btn-primary" id="save">Save key</button>
            </form>
            <p class="muted hint" id="key-hint">In the dashboard, open API keys, create a key and paste it here.</p>
            <p class="status" id="status" role="status"></p>
          </div>
        </div>
      </div>
    </main>
    <script src="options.js" type="module"></script>
  </body>
</html>
