<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="generator" content="SvelteKit" />

        <!-- Resolve theme before first paint so light-mode users never see a dark flash.
             Mirrors getInitialTheme() in $lib/stores/theme.js. -->
        <script>
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        </script>

        <!-- Self-hosted Geist (variable). Latin subset is preloaded; latin-ext loads on demand. -->
        <link rel="preload" href="%sveltekit.assets%/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

        <!-- Security headers (X-Frame-Options set via HTTP header in vercel.json) -->
        <meta http-equiv="X-Content-Type-Options" content="nosniff">
        <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

        <meta name="google-adsense-account" content="ca-pub-2753774406694455">

        <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
        <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
        <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
        <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover" class="sveltekit-body">
        <div class="sveltekit-container">%sveltekit.body%</div>

        <!-- AdSense: loaded after the page is idle so it never competes with hydration. -->
        <script>
            window.addEventListener('load', function () {
                setTimeout(function () {
                    var s = document.createElement('script');
                    s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2753774406694455';
                    s.async = true;
                    s.crossOrigin = 'anonymous';
                    document.head.appendChild(s);
                }, 2000);
            });
        </script>
    </body>
</html>
