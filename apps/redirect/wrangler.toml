name = "iksi-redirect"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "iksi.app/*", zone_name = "iksi.app" },
  { pattern = "www.iksi.app/*", zone_name = "iksi.app" }
]

[vars]
ORIGIN_URL = "https://www.iksi.app"

[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_WITH_KV_ID"

[[queues.producers]]
binding = "CLICKS"
queue = "iksi-clicks"

[[queues.consumers]]
queue = "iksi-clicks"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 10
dead_letter_queue = "iksi-clicks-dlq"
